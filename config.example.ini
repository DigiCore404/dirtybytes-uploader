; DirtyBytes Uploader - edit these settings, then run start.cmd or start.sh.
; Get your API key and personal announce URL from your DirtyBytes account.
; Relative paths are relative to the uploader folder. Windows paths are supported.
[Website]
SITEURL = https://dirtybytes.net
API_KEY =

[Torrent]
# Comma-separated globs excluded only from new torrent payloads; source files stay untouched.
EXCLUDE_PATTERNS =
HASHER = mkbrr
; Empty uses mkbrr on PATH or the bundled Linux executable.
MKBRR_BIN =
ANNOUNCEURL =

[Paths]
; Folder containing your release folders. Content is never moved or renamed.
DATADIR = content
; Completed .torrent files go here. Configure this folder in your torrent client.
WATCHFOLDER = watch

[Settings]
; Use images found inside the selected folder unless image URLs are entered.
IMAGE_UPLOAD = true
SCREENSHOTS = true
MEDIAINFO = true
DUPECHECK = true

; Optional automatic uploads: watch immediate subfolders of DATADIR.
; Start explicitly with: python uploader.py watch --cat 9
[Watch]
INTERVAL_SECONDS = 30
STABLE_SECONDS = 120
; Optional dedicated subfolder of DATADIR, e.g. incoming. Empty watches DATADIR.
INCOMING_DIR =

; Advanced options are documented in defaults.ini; override them here as needed.

[Web]
; First-run login defaults. Subsequent changes are saved privately in SQLite.
USERNAME = admin
; Empty means any reachable IP; use individual IPs or comma-separated CIDRs.
ALLOWED_IPS =
; Workspace login, separate from your DirtyBytes API key.
; Or set DIRTYBYTES_WEB_PASSWORD in the environment.
; If empty, a temporary password is printed when starting the web interface.
PASSWORD =

[ThePornDB]
; Optional metadata lookup. Token stays on this server.
TOKEN =

[ImageHost]
; Own site host is the default. For ImgBB: PROVIDER = imgbb and API_KEY = your ImgBB key.
PROVIDER =
API_KEY =

; Browser import defaults, also editable in Settings. These do not start a watcher.
; Both roots must refer to the same physical storage; paths may differ in Docker.
[Imports]
CLIENT_ID =
REMOTE_ROOT =
; Blank uses Paths.DATADIR.
LOCAL_ROOT =

[Metadata]
; Lookup titles only: literal tags/phrases, one per line. Empty disables tag removal.
SEARCH_IGNORE_WORDS = XXX
